# =====================================================================
# SMMS 一键部署编排（NFR-CMP-05 / AC-D04）：MySQL 8.4 + 后端 + Nginx
# 用法：
#   docker compose up -d --build
#   浏览器访问 http://localhost   （管理端），后端健康：http://localhost:8080/actuator/health
#   端口/密码如需覆盖：在仓库根目录创建 .env（已被 .gitignore 排除），
#   变量清单见 docs/部署与运维手册.md §3.3；未提供时全部使用下方默认值。
#   公网发布（无公网 IP 亦可）：在 .env 设置 SMMS_TUNNEL_TOKEN 后
#   docker compose --profile tunnel up -d --build，详见 docs/部署与运维手册.md §3.5。
# =====================================================================
name: smms

services:
  mysql:
    image: mysql:8.4
    container_name: smms-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-time-zone=+08:00
      - --max-connections=300
    environment:
      MYSQL_ROOT_PASSWORD: ${SMMS_DB_ROOT_PASSWORD:-Smms_root_2024}
      MYSQL_DATABASE: smms
      MYSQL_USER: smms
      MYSQL_PASSWORD: ${SMMS_DB_PASSWORD:-Smms_dev_2024}
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      # 仅首次初始化（数据卷为空）时按文件名顺序执行
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/init-data.sql:/docker-entrypoint-initdb.d/02-init-data.sql:ro
    ports:
      # BIND 为监听地址：默认 0.0.0.0（现状不变）；隧道/生产建议改为 127.0.0.1 只允许本机访问
      - "${SMMS_MYSQL_BIND:-0.0.0.0}:${SMMS_MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  backend:
    build: ./backend
    container_name: smms-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # 容器内不使用 local 配置档，连接参数全部经环境变量注入
      SPRING_PROFILES_ACTIVE: docker
      SMMS_DB_HOST: mysql
      SMMS_DB_PORT: "3306"
      SMMS_DB_NAME: smms
      SMMS_DB_USER: smms
      SMMS_DB_PASSWORD: ${SMMS_DB_PASSWORD:-Smms_dev_2024}
      SMMS_JWT_SECRET: ${SMMS_JWT_SECRET:-Smms-docker-jwt-secret-please-change-in-production}
      # 非本机来源访问（局域网/域名）时在 .env 中追加允许的前端来源，逗号分隔
      SMMS_CORS_ORIGINS: ${SMMS_CORS_ORIGINS:-http://localhost:5173}
      TZ: Asia/Shanghai
    ports:
      - "${SMMS_SERVER_BIND:-0.0.0.0}:${SMMS_SERVER_PORT:-8080}:8080"
    volumes:
      # 商品图片（IR-SW-05）与应用文件日志（IR-SW-07）持久化，容器重建不丢失
      - uploads-data:/app/uploads
      - backend-logs:/app/logs

  nginx:
    build: ./frontend
    container_name: smms-nginx
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${SMMS_WEB_BIND:-0.0.0.0}:${SMMS_WEB_PORT:-80}:80"

  # 可选：Cloudflare Tunnel 出站隧道，把 Nginx 发布为公网 HTTPS 域名，
  # 无需公网 IP、无需开放任何入站端口（出站 443 即可）。
  # 启用：.env 中设置 SMMS_TUNNEL_TOKEN 后执行 docker compose --profile tunnel up -d
  # 隧道直接指向 nginx:80（同一入口提供静态页与 /api 反代），故无需改动 CORS。
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: smms-cloudflared
    restart: unless-stopped
    profiles: ["tunnel"]
    depends_on:
      nginx:
        condition: service_started
    environment:
      # cloudflared 从该环境变量读取隧道凭据；未设置时容器启动即报 token 错误（属预期）
      TUNNEL_TOKEN: ${SMMS_TUNNEL_TOKEN:-}
      TZ: Asia/Shanghai
    command: ["tunnel", "--no-autoupdate", "--loglevel", "info", "run"]

volumes:
  mysql-data:
  uploads-data:
  backend-logs:
