<line x1="67" y1="777" x2="1433" y2="777" stroke="#8ea9c8" stroke-width="1" opacity="0.55"/>
<text x="750.0" y="801" text-anchor="middle" font-size="13" font-family="SimHei" font-weight="normal" fill="#1f2d3d">BR-RPT-01 净销售 = 销售额 - 优惠额 - 退货额；商品 / 品类 / 品牌 / 毛利分析同样扣退货</text>
<text x="750.0" y="826" text-anchor="middle" font-size="13" font-family="SimHei" font-weight="normal" fill="#1f2d3d">BR-RPT-02 所有业务单据落库写入 business_date，报表按营业日聚合（不再用 create_time 运行时计算）</text>
<text x="750.0" y="851" text-anchor="middle" font-size="13" font-family="SimHei" font-weight="normal" fill="#1f2d3d">BR-RPT-03 仅统计正式单据：排除草稿、作废、终止；采购在途 = 订购 - 已入库；退货按已审核退货单汇总</text>
<text x="750.0" y="876" text-anchor="middle" font-size="13" font-family="SimHei" font-weight="normal" fill="#1f2d3d">BR-RPT-04 默认今日 + 七个统一快捷区间；BR-RPT-05 金额 / 百分比统一 2 位小数，除零显示 —</text>
<text x="750.0" y="901" text-anchor="middle" font-size="13" font-family="SimHei" font-weight="normal" fill="#1f2d3d">BR-RPT-07 成本、毛利、采购金额按角色屏蔽；导出复用服务层，通道不绕过掩码</text>
