<text x="1117.5" y="648" text-anchor="middle" font-size="14" font-family="SimHei" font-weight="normal" fill="#1f2d3d">BR-RPT-02 按 business_date 聚合</text>
<text x="1117.5" y="670" text-anchor="middle" font-size="14" font-family="SimHei" font-weight="normal" fill="#1f2d3d">BR-RPT-07 成本 / 毛利按角色掩码</text>
<text x="1117.5" y="692" text-anchor="middle" font-size="14" font-family="SimHei" font-weight="normal" fill="#1f2d3d">导出复用同一服务，不绕过掩码</text>
