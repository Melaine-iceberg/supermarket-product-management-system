<text x="225.0" y="436" text-anchor="middle" font-size="14" font-family="SimHei" font-weight="normal" fill="#1f2d3d">@RequirePerm 权限校验</text>
<text x="225.0" y="458" text-anchor="middle" font-size="14" font-family="SimHei" font-weight="normal" fill="#1f2d3d">@OpLog 操作留痕</text>
