<text x="1117.5" y="458" text-anchor="middle" font-size="14" font-family="SimHei" font-weight="normal" fill="#1f2d3d">PurchaseReportService：汇总 / 排行 / 价格</text>
<text x="1117.5" y="480" text-anchor="middle" font-size="14" font-family="SimHei" font-weight="normal" fill="#1f2d3d">DrillDownService：汇总数字到构成单据</text>
<text x="1117.5" y="502" text-anchor="middle" font-size="14" font-family="SimHei" font-weight="normal" fill="#1f2d3d">ReportExcelService + AsyncTaskService：导出</text>
