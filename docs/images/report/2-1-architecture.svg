<text x="632.5" y="480" text-anchor="middle" font-size="14" font-family="SimHei" font-weight="normal" fill="#1f2d3d">SuggestPurchaseService：建议量 / 生成草稿</text>
<text x="632.5" y="502" text-anchor="middle" font-size="14" font-family="SimHei" font-weight="normal" fill="#1f2d3d">PurchaseReturnService：退货审核 / 冲减</text>
