# SMMS 前端站点：静态资源托管 + /api 反向代理（容器编排内使用）
server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # 真实客户端 IP：Cloudflare Tunnel（cloudflared）会覆盖 CF-Connecting-IP，
    # 仅当直连来源属容器网络/内网网段时才信任该头；公网直连来源不在上述网段内，
    # 其伪造的同名头会被忽略，仍按实际对端地址留痕。
    set_real_ip_from  10.0.0.0/8;
    set_real_ip_from  172.16.0.0/12;
    set_real_ip_from  192.168.0.0/16;
    real_ip_header    CF-Connecting-IP;
    real_ip_recursive on;

    # gzip 压缩（NFR-PERF-08）
    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   1k;
    gzip_types        text/plain text/css application/json application/javascript
                      application/xml image/svg+xml;

    # 后端接口反向代理：保留 /api/v1 前缀转发至 Spring Boot
    location /api/ {
        proxy_pass              http://backend:8080;
        proxy_http_version      1.1;
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        # 只透传单跳真实地址：避免客户端自带的 X-Forwarded-For 被后端当作真实 IP 留痕
        proxy_set_header        X-Forwarded-For   $remote_addr;
        proxy_set_header        X-Forwarded-Proto $scheme;
        # 商品/会员 Excel 导入（≤10MB）与报表导出耗时较长，放宽限制
        client_max_body_size    20m;
        proxy_read_timeout      300s;
        proxy_send_timeout      300s;
    }

    # 带哈希指纹的构建产物长缓存；index.html 不缓存
    location ~* \.(js|css|png|jpe?g|gif|svg|ico|woff2?)$ {
        expires    7d;
        add_header Cache-Control "public";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 前端路由 history 模式回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
