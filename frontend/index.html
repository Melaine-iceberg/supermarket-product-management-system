<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!-- 声明同时支持浅色/深色，原生 UI 与首屏画布可提前适配 -->
    <meta name="color-scheme" content="light dark" />
    <script>
      // 首屏渲染前读取已保存主题，避免深浅色闪烁（FOUC）；存储不可用时仍跟随系统
      ;(() => {
        let stored = null
        try {
          stored = localStorage.getItem('smms-color-scheme')
        } catch {
          /* 隐私模式：仅本次会话跟随系统 */
        }
        const pinned = stored === 'light' || stored === 'dark'
        const scheme = pinned
          ? stored
          : matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light'
        document.documentElement.classList.toggle('dark', scheme === 'dark')
        const meta = document.querySelector('meta[name="color-scheme"]')
        if (meta) meta.content = pinned ? stored : 'light dark'
      })()
    </script>
    <!-- PWA：浏览器 UI 主题色与 iOS 全屏安装支持 -->
    <meta name="theme-color" content="#2563eb" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="超市管理" />
    <meta name="description" content="超市商品、库存、采购、会员与报表一体化管理系统" />
    <title>超市商品管理系统</title>
  </head>
  <body>
    <div id="app" class="isolate"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
