plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.smms'
version = '0.1.0-SNAPSHOT'
description = '超市商品管理系统（SMMS）后端服务'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

// 保留方法参数名（@Valid 校验消息、OpLog SpEL 目标解析依赖）
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-parameters'
}

// 生成构建信息，供 /actuator/info 展示版本号（IR-SW-08）
springBoot {
    buildInfo()
}

repositories {
    mavenCentral()
}

dependencies {
    // Web / 校验 / 切面 / 监控 / 安全
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.aspectj:aspectjweaver'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // JWT（HMAC-SHA，密钥长度决定 HS256/384/512，IR-SW-03）
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // ORM：MyBatis-Plus（Spring Boot 4 专用 starter）+ 分页插件（3.5.9+ 拆分至独立包）
    implementation 'com.baomidou:mybatis-plus-spring-boot4-starter:3.5.17'
    implementation 'com.baomidou:mybatis-plus-jsqlparser:3.5.17'

    // Excel 导入导出（FR-GOODS-11/12，Apache-2.0）
    implementation 'org.apache.poi:poi-ooxml:5.4.1'

    // 汉字转拼音（FR-SALE-02 收银拼音首字母检索，BSD）
    implementation 'com.belerweb:pinyin4j:2.5.1'

    // 邮件验证码发送（V1.3 多渠道登录）：标准 SMTP，一套代码覆盖 QQ/163/企业邮/Gmail/Outlook
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    // 数据库驱动
    runtimeOnly 'com.mysql:mysql-connector-j'

    // 工具
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    // 测试
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // 集成测试：Testcontainers 起真 MariaDB 验证并发不超卖（NFR-MNT-05/AC-08）；
    // SQL 依赖 MySQL/MariaDB 语义（ON DUPLICATE KEY UPDATE、SET 左到右求值），不可用 H2 替代。
    // 无 Docker 环境由 @Testcontainers(disabledWithoutDocker = true) 自动跳过。
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-mariadb'
    testRuntimeOnly 'org.mariadb.jdbc:mariadb-java-client'
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy tasks.named('jacocoTestReport')
}

// 覆盖率报告（NFR-MNT-05 / AC-D03）：./gradlew test jacocoTestReport
// 报告：build/reports/jacoco/test/html/index.html 与 test/jacocoTestReport.csv
tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        csv.required = true
        html.required = true
    }
}
