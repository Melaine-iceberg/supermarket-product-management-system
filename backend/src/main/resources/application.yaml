spring:
  application:
    name: smms-server
  # 本地开发凭据放在 application-local.yaml（不入库），见 .gitignore
  profiles:
    default: local
  datasource:
    url: jdbc:mysql://${SMMS_DB_HOST:localhost}:${SMMS_DB_PORT:3306}/${SMMS_DB_NAME:smms}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${SMMS_DB_USER:smms}
    password: ${SMMS_DB_PASSWORD:change-me}
    hikari:
      pool-name: smms-hikari
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 5000
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

server:
  port: ${SMMS_SERVER_PORT:8080}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
