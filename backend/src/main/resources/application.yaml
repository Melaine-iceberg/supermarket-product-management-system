spring:
  application:
    name: smms-server
  # 本地开发凭据放在 application-local.yaml（不入库），见 .gitignore
  profiles:
    default: local
  datasource:
    url: jdbc:mysql://${SMMS_DB_HOST:localhost}:${SMMS_DB_PORT:3306}/${SMMS_DB_NAME:smms}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${SMMS_DB_USER:smms}
    password: ${SMMS_DB_PASSWORD:change-me}
    hikari:
      pool-name: smms-hikari
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 5000
      # READ COMMITTED（跨 MySQL/MariaDB 兼容；非 MySQL 默认 RR）：
      # MariaDB 11+ 默认 innodb_snapshot_isolation=ON，RR 下"先读后写"事务更新被并发事务改过的行
      # 会抛 1020（ER_CHECKREAD）中断业务（如并发收银先读商品再扣减库存，NFR-MNT-05/AC-08）；
      # RC 下条件扣减仍由单语句行锁串行、余量判定语义不变，行为与 MySQL 默认实现一致
      transaction-isolation: TRANSACTION_READ_COMMITTED
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

server:
  port: ${SMMS_SERVER_PORT:8080}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

smms:
  # V1.2 多渠道登录开关
  # ⚠ 启用 phone/email 前必须接入真实短信/邮件通道（实现 AuthCodeSender 接口），
  #   否则验证码只会写入后端日志，线上等于无人能收到
  login:
    password: true          # 用户名密码登录（兼容旧账号，建议始终保留）
    phone: true             # 手机号 + 短信验证码
    email: true             # 邮箱 + 邮件验证码
    register: true          # 员工自助注册（注册即用）
    default-role-id: 5      # 自助注册默认角色ID，必须与 db/init-data.sql 的 sys_role.id 一致
                            # 1超级管理员 2店长 3采购员 4库管员 5收银员——自注册默认给权限最小的收银员
    code-expire-minutes: 5
    code-interval-seconds: 60
    code-daily-limit: 10    # 同一手机号/邮箱 24 小时内最多发送条数
    code-max-attempts: 5    # 单条验证码最多校验失败次数，超出作废
    # 仅本地联调可置 true：把验证码直接放在接口响应里，避免每次翻日志
    expose-code-in-response: false
    wechat:
      enabled: false        # 需微信开放平台 AppID/AppSecret 与已备案回调域名
      app-id: ""
      app-secret: ""        # 可用 SMMS_LOGIN_WECHAT_APP_SECRET 覆盖（勿写 ${WECHAT_APP_SECRET:}：命名不统一易漏配）
      redirect-uri: ""
      scope: snsapi_login

  # V1.3 验证码外发通道（短信/邮件真正发出去的能力）
  # provider 取 log 时仅打日志不外发（开发/演示模式）；取 aliyun / smtp 时必须
  # 把凭证配齐，否则自动回退到日志模式并在启动日志中告警。
  # 全部字段都可用环境变量覆盖，便于容器化部署，例如：
  #   SMMS_CODE_SMS_PROVIDER=aliyun  SMMS_CODE_SMS_ALIYUN_ACCESS_KEY_ID=xxx
  #   SMMS_CODE_EMAIL_PROVIDER=smtp   SMMS_CODE_EMAIL_SMTP_HOST=smtp.qq.com
  code:
    sms:
      provider: ${SMMS_CODE_SMS_PROVIDER:log}   # log | aliyun
      aliyun:
        access-key-id: ${SMMS_CODE_SMS_ALIYUN_ACCESS_KEY_ID:}
        access-key-secret: ${SMMS_CODE_SMS_ALIYUN_ACCESS_KEY_SECRET:}
        sign-name: ${SMMS_CODE_SMS_ALIYUN_SIGN_NAME:}                  # 已报备的短信签名，如“好又多超市”
        template-code-login: ${SMMS_CODE_SMS_ALIYUN_TEMPLATE_LOGIN:}   # 登录用模板，变量名必须是 code
        template-code-register: ${SMMS_CODE_SMS_ALIYUN_TEMPLATE_REGISTER:}  # 可留空，留空则注册也走登录模板
        endpoint: ${SMMS_CODE_SMS_ALIYUN_ENDPOINT:dysmsapi.aliyuncs.com}
        timeout-ms: ${SMMS_CODE_SMS_ALIYUN_TIMEOUT_MS:5000}
    email:
      provider: ${SMMS_CODE_EMAIL_PROVIDER:log}  # log | smtp
      smtp:
        host: ${SMMS_CODE_EMAIL_SMTP_HOST:}        # smtp.qq.com / smtp.163.com / smtp.exmail.qq.com ...
        port: ${SMMS_CODE_EMAIL_SMTP_PORT:465}
        username: ${SMMS_CODE_EMAIL_SMTP_USERNAME:}   # 通常是完整邮箱地址
        password: ${SMMS_CODE_EMAIL_SMTP_PASSWORD:}   # ⚠ 是“授权码”不是登录密码
        from: ${SMMS_CODE_EMAIL_SMTP_FROM:}           # 留空则用 username；可写“好又多超市 <noreply@x.com>”
        from-name: ${SMMS_CODE_EMAIL_SMTP_FROM_NAME:好又多超市}
        ssl-enabled: ${SMMS_CODE_EMAIL_SMTP_SSL:true}            # true→465 隐式 SSL；false→587 STARTTLS
        starttls-enabled: ${SMMS_CODE_EMAIL_SMTP_STARTTLS:false}
        timeout-ms: ${SMMS_CODE_EMAIL_SMTP_TIMEOUT_MS:10000}
  # JWT 密钥（IR-SW-03：HS256，长度≥32字节；生产环境必须通过环境变量覆盖）
  jwt:
    secret: ${SMMS_JWT_SECRET:dev-only-smms-jwt-secret-please-override-in-production}
  cors:
    # 前端开发服务器地址
    allowed-origins: ${SMMS_CORS_ORIGINS:http://localhost:5173}
  # 异步任务（重导出/导入提交后台执行，规避反向代理源站超时）
  task:
    # 结果文件目录（容器内；也可用环境变量 SMMS_TASK_FILE_DIR 覆盖）
    file-dir: ${SMMS_TASK_FILE_DIR:${java.io.tmpdir}/smms-task-files}
    # 结果保留时长（小时），过期后任务与文件被清理
    retain-hours: ${SMMS_TASK_RETAIN_HOURS:24}
    core-pool-size: ${SMMS_TASK_CORE_POOL:2}
    max-pool-size: ${SMMS_TASK_MAX_POOL:4}
    queue-capacity: ${SMMS_TASK_QUEUE_CAPACITY:50}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
