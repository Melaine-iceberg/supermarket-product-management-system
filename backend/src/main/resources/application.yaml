spring:
  application:
    name: smms-server
  # 本地开发凭据放在 application-local.yaml（不入库），见 .gitignore
  profiles:
    default: local
  datasource:
    url: jdbc:mysql://${SMMS_DB_HOST:localhost}:${SMMS_DB_PORT:3306}/${SMMS_DB_NAME:smms}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${SMMS_DB_USER:smms}
    password: ${SMMS_DB_PASSWORD:change-me}
    hikari:
      pool-name: smms-hikari
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 5000
      # READ COMMITTED（跨 MySQL/MariaDB 兼容；非 MySQL 默认 RR）：
      # MariaDB 11+ 默认 innodb_snapshot_isolation=ON，RR 下"先读后写"事务更新被并发事务改过的行
      # 会抛 1020（ER_CHECKREAD）中断业务（如并发收银先读商品再扣减库存，NFR-MNT-05/AC-08）；
      # RC 下条件扣减仍由单语句行锁串行、余量判定语义不变，行为与 MySQL 默认实现一致
      transaction-isolation: TRANSACTION_READ_COMMITTED
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  # 上传大小限制（IR-SW-04）：Excel 导入单文件 ≤10MB，超限由全局异常转业务提示（错误码 1115）
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: ${SMMS_SERVER_PORT:8080}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

smms:
  # JWT 密钥（IR-SW-03：HS256，长度≥32字节；生产环境必须通过环境变量覆盖）
  jwt:
    secret: ${SMMS_JWT_SECRET:dev-only-smms-jwt-secret-please-override-in-production}
  cors:
    # 前端开发服务器地址
    allowed-origins: ${SMMS_CORS_ORIGINS:http://localhost:5173}
  # 商品图片上传（IR-SW-05）：本地可配置目录，与 Web 根隔离，经受控接口访问
  upload:
    dir: ${SMMS_UPLOAD_DIR:./uploads}
  # 异步任务（重导出/导入提交后台执行，规避反向代理源站超时）
  task:
    # 结果文件目录（容器内；也可用环境变量 SMMS_TASK_FILE_DIR 覆盖）
    file-dir: ${SMMS_TASK_FILE_DIR:${java.io.tmpdir}/smms-task-files}
    # 结果保留时长（小时），过期后任务与文件被清理
    retain-hours: ${SMMS_TASK_RETAIN_HOURS:24}
    core-pool-size: ${SMMS_TASK_CORE_POOL:2}
    max-pool-size: ${SMMS_TASK_MAX_POOL:4}
    queue-capacity: ${SMMS_TASK_QUEUE_CAPACITY:50}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

# 日志（IR-SW-07）：文件按天/大小滚动、ERROR 独立文件，详见 logback-spring.xml
logging:
  level:
    com.smms: info
